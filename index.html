<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#48C3F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Crown of Emeraldia: 16-Bit Platformer</title>
    <meta name="description" content="A complete classic 16-bit side-scrolling pixel art platformer featuring five handcrafted levels, custom pixel sprites, responsive platforming physics, power-ups, chiptune music, and an epic castle boss battle." />
    <meta property="og:title" content="Crown of Emeraldia: 16-Bit Platformer" />
    <meta property="og:description" content="A complete classic 16-bit side-scrolling pixel art platformer featuring five handcrafted levels, custom pixel sprites, responsive platforming physics, power-ups, chiptune music, and an epic castle boss battle." />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #48C3F7;" class="bg-[#48C3F7] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 overflow-x-hidden">
    <!-- Cold-Start Splash Screen: Shown only while initial resources load, dismissed immediately on first frame with zero fake delay -->
    <div
      id="cold-start-splash"
      aria-label="Loading Crown of Emeraldia"
      style="position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#46C5F9 0%,#7DD3FC 65%,#A5DFFB 100%);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 120ms ease-out;"
    >
      <img
        src="/splash.png"
        alt="Crown of Emeraldia Splash Screen"
        style="width:100%;height:100%;max-width:540px;object-fit:cover;image-rendering:pixelated;"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
