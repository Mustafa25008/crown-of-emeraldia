<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#48C3F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Crown of Emeraldia: 16-Bit Platformer</title>
    <meta name="description" content="A complete classic 16-bit side-scrolling pixel art platformer featuring five handcrafted levels, custom pixel sprites, responsive platforming physics, power-ups, chiptune music, and an epic castle boss battle." />
    <meta property="og:title" content="Crown of Emeraldia: 16-Bit Platformer" />
    <meta property="og:description" content="A complete classic 16-bit side-scrolling pixel art platformer featuring five handcrafted levels, custom pixel sprites, responsive platforming physics, power-ups, chiptune music, and an epic castle boss battle." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #48C3F7;" class="bg-[#48C3F7] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 overflow-x-hidden">
    <!-- Cold-Start Splash Screen: Portrait /splash.png on Mobile, Widescreen /splash-landscape.png on Desktop/Landscape Web -->
    <style>
      #cold-start-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: linear-gradient(180deg, rgb(69, 194, 248) 0%, rgb(167, 223, 252) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        overflow: hidden;
        transition: opacity 120ms ease-out;
      }
      #cold-start-splash picture {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cold-start-splash img {
        width: 100%;
        height: 100%;
        max-width: 540px;
        object-fit: cover;
        image-rendering: pixelated;
      }
      @media (orientation: landscape) and (min-width: 640px) {
        #cold-start-splash img {
          max-width: none;
          object-fit: contain;
        }
      }
    </style>
    <div
      id="cold-start-splash"
      aria-label="Loading Crown of Emeraldia"
    >
      <picture>
        <source media="(orientation: landscape) and (min-width: 640px)" srcset="/splash-landscape.png" />
        <img
          src="/splash.png"
          alt="Crown of Emeraldia Splash Screen"
        />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
